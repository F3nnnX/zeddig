<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Blue background with rounded corners -->
  <rect width="64" height="64" rx="12" fill="#1A2B6D"/>

  <!-- White letter Z -->
  <text x="32" y="44" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" fill="white" text-anchor="middle">Z</text>

  <!-- Small green square (dot) in bottom right of letter -->
